name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

      - name: Installer test (Unix)
        if: runner.os != 'Windows'
        run: npm run test:installer

      - name: Installer test (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: .\tests\installer.test.ps1

      - name: Installer test (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\tests\installer.test.ps1
